name: build-tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # macOS 14 镜像已于 2026-11-02 被 GitHub 全量退役。
    # 任何 runs-on: macos-14 都会在 1 秒内被取消并报:
    #   The configuration 'macos-14-arm64-us-default' is not supported
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      # Theos 最后要给 dylib 做 ad-hoc 签名, macOS runner 默认没有 ldid。
      - name: Install ldid
        run: |
          set -euo pipefail
          brew install ldid
          command -v ldid

      - name: Fetch iOS SDKs
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          curl -fL --retry 3 -o /tmp/sdks.tar.gz \
            https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          mv /tmp/sdks-master/*.sdk "$THEOS/sdks/"
          echo "--- available SDKs ---"
          ls "$THEOS/sdks"

      # 编译失败时把 tail 写进 Job Summary, 这样在 run 页面就能直接看到报错,
      # 不必去下载日志或来回猜。
      - name: Build dylib
        run: |
          set -o pipefail
          make clean || true

          set +e
          make ARCHS="arm64 arm64e" FINALPACKAGE=1 > /tmp/build.log 2>&1
          rc=$?
          set -e

          {
            echo "## make exit code: $rc"
            echo '```'
            tail -n 250 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -ne 0 ]; then
            echo "===== build failed, tail of log ====="
            tail -n 250 /tmp/build.log
            exit "$rc"
          fi

          echo "--- build output ---"
          find .theos -name '*.dylib' -print

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find .theos -name '*.dylib' -exec cp {} dist/ \;
          test -n "$(ls -A dist)" || { echo "没有产出 dylib"; exit 1; }
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: YSFDeviceReset-dylib
          path: dist/*.dylib
          if-no-files-found: error
